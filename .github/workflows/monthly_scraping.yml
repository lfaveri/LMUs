name: Automação Mensal de Scraping PNIPE

on:
  schedule:
    # Executa às 03:00 UTC no dia 1 de cada mês
    - cron: '0 3 1 * *'
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub Actions

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Pipeline de Scraping
        run: |
          python main.py

      - name: Commit e Push dos Dados Atualizados
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): atualização mensal dos dados PNIPE [skip ci]"
          file_pattern: "data/*"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
